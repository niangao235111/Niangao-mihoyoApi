server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:17892}
spring:
  config:
    import:
      - optional:file:./.local/redis-local.yaml
      - optional:file:./.local/workbench-local.yaml
      - optional:file:./.local/mysql-local.yaml
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/genshinImpact?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      connection-init-sql: "SET time_zone = '+00:00'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
  application:
    name: niangao-mihoyo
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
mihoyo:
  passport-endpoint: https://passport-api.mihoyo.com
  binding-endpoint: https://api-takumi.mihoyo.com
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}
  session-ttl: 600s
  max-sessions: 20
  connect-timeout: 15s
  response-timeout: 25s
  redis:
    key-prefix: ${MIHOYO_REDIS_PREFIX:niangao:mihoyo}
    phone-key-secret: ${MIHOYO_PHONE_KEY_SECRET:}
    operation-timeout: 90s
    sms-cooldown: 60s

# Spring Boot 默认控制台输出；业务日志 INFO，轮询与上游请求阶段 DEBUG。
logging:
  file:
    name: ${APP_LOG_FILE:${user.dir}/.local/backend.log}
  level:
    com.niangao.mihoyo: ${APP_LOG_LEVEL:INFO}

# 原神战绩：网页仅调用本站 /api/genshin/*，不接触上游 Cookie 和签名。
genshin:
  wishes:
    auth-app-version: ${GENSHIN_WISH_AUTH_APP_VERSION:2.71.1}
    auth-ds-salt: ${GENSHIN_WISH_AUTH_DS_SALT:EJncUPGnOHajenjLhBOsdpwEMZmiCmQX}
    page-delay-ms: ${GENSHIN_WISH_PAGE_DELAY_MS:750}
  storage:
    enabled: true
  record-endpoint: https://api-takumi-record.mihoyo.com
  device-fp-endpoint: https://public-data-api.mihoyo.com
  ds-salt: ${GENSHIN_RECORD_DS_SALT:xV8v4Qu54lUKrEYFZkJhB8cuOh9Asafs}
  app-version: ${GENSHIN_RECORD_APP_VERSION:2.11.1}

workbench:
  session:
    idle-ttl: 7d
    absolute-ttl: 30d
    key-prefix: ${WORKBENCH_SESSION_PREFIX:niangao:workbench}
    encryption-key: ${WORKBENCH_ENCRYPTION_KEY:}
    cookie-secure: ${WORKBENCH_COOKIE_SECURE:false}
    allowed-origins: ${WORKBENCH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4321,http://localhost:4321}
